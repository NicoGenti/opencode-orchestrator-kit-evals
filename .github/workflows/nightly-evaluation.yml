# Nightly DRY_RUN evaluation of every scenario.
#
# The job only opens or updates the "Nightly evaluation failed" issue when it
# fails; a green run leaves no issue behind. Run artifacts are uploaded, never
# committed.

name: Nightly evaluation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    name: dry-run evaluation of all scenarios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the evaluation suite
        uses: actions/checkout@v4

      - name: Checkout the kit at main
        uses: actions/checkout@v4
        with:
          repository: NicoGenti/opencode-orchestrator-kit
          ref: main
          path: .kit

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run every scenario
        id: eval
        env:
          DRY_RUN: "1"
        run: |
          set -euo pipefail
          KIT_COMMIT="$(git -C .kit rev-parse HEAD)"
          bun scripts/run-suite.ts \
            --kit-version nightly \
            --kit-ref main \
            --kit-commit "$KIT_COMMIT" \
            --scenario all \
            --model-profile default \
            --output-dir runs | tee run-suite.log
          RUN_DIR="$(grep '^RUN_DIR=' run-suite.log | tail -n 1 | cut -d= -f2-)"
          test -n "$RUN_DIR"
          echo "run_dir=$RUN_DIR" >> "$GITHUB_OUTPUT"

      - name: Validate the generated artifacts
        run: bun scripts/validate-run.ts --run-dir "${{ steps.eval.outputs.run_dir }}"

      - name: Generate the Markdown report
        run: |
          set -euo pipefail
          bun scripts/generate-report.ts \
            --run-dir "${{ steps.eval.outputs.run_dir }}" \
            --out "${{ steps.eval.outputs.run_dir }}/report.md"

      - name: Upload the run directory
        uses: actions/upload-artifact@v4
        with:
          name: eval-run-nightly
          path: ${{ steps.eval.outputs.run_dir }}
          if-no-files-found: error
          retention-days: 14

      - name: Open or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Nightly evaluation failed"
          BODY="$(printf 'The nightly dry-run evaluation failed.\n\n- Run: %s\n- Commit: %s\n- Failed at (UTC): %s\n' "$RUN_URL" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)")"
          EXISTING="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
