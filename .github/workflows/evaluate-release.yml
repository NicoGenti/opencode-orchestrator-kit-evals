# Manual release evaluation of opencode-orchestrator-kit.
#
# The suite runs in DRY_RUN mode: no provider credential is used and no metric
# is produced. The run directory is uploaded as a workflow artifact and is never
# committed back to the repository.

name: Evaluate release

on:
  workflow_dispatch:
    inputs:
      kit_version:
        description: "Version label recorded in the run path, for example 1.2.0"
        required: true
        type: string
      kit_ref:
        description: "Git ref of NicoGenti/opencode-orchestrator-kit to evaluate"
        required: true
        default: main
        type: string
      model_profile:
        description: "Model profile label recorded in the run path"
        required: true
        default: default
        type: string
      scenario:
        description: "Scenario id, or all"
        required: true
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: evaluate-release-${{ inputs.kit_version }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: dry-run evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the evaluation suite
        uses: actions/checkout@v4

      - name: Checkout the kit at the requested ref
        uses: actions/checkout@v4
        with:
          repository: NicoGenti/opencode-orchestrator-kit
          ref: ${{ inputs.kit_ref }}
          path: .kit

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run the evaluation suite
        id: eval
        env:
          DRY_RUN: "1"
          KIT_VERSION: ${{ inputs.kit_version }}
          KIT_REF: ${{ inputs.kit_ref }}
          MODEL_PROFILE: ${{ inputs.model_profile }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          KIT_COMMIT="$(git -C .kit rev-parse HEAD)"
          bun scripts/run-suite.ts \
            --kit-version "$KIT_VERSION" \
            --kit-ref "$KIT_REF" \
            --kit-commit "$KIT_COMMIT" \
            --scenario "$SCENARIO" \
            --model-profile "$MODEL_PROFILE" \
            --output-dir runs | tee run-suite.log
          RUN_DIR="$(grep '^RUN_DIR=' run-suite.log | tail -n 1 | cut -d= -f2-)"
          test -n "$RUN_DIR"
          echo "run_dir=$RUN_DIR" >> "$GITHUB_OUTPUT"

      - name: Validate the generated artifacts
        run: bun scripts/validate-run.ts --run-dir "${{ steps.eval.outputs.run_dir }}"

      - name: Generate the Markdown report
        run: |
          set -euo pipefail
          bun scripts/generate-report.ts \
            --run-dir "${{ steps.eval.outputs.run_dir }}" \
            --out "${{ steps.eval.outputs.run_dir }}/report.md"

      - name: Upload the run directory
        uses: actions/upload-artifact@v4
        with:
          name: eval-run-${{ inputs.kit_version }}-${{ inputs.model_profile }}
          path: ${{ steps.eval.outputs.run_dir }}
          if-no-files-found: error
          retention-days: 30
